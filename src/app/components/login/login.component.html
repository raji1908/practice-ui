<div class="login">
  <h2>Login</h2>
  <form (submit)="$event.preventDefault(); login()">
    <div class="form-control">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
        [value]="username"
        (input)="username = $any($event.target).value"
      />
    </div>
    <div class="form-control">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [value]="password"
        (input)="password = $any($event.target).value"
      />
    </div>
    <button class="form-control" type="submit">Log in</button>
  </form>
</div>
